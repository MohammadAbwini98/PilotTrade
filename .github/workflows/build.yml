name: Build and Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: npm_install
        run: npm ci
        working-directory: src/PilotTrade.Web
      - id: lint
        run: npm run lint
        working-directory: src/PilotTrade.Web
      - id: frontend_build
        run: npm run build
        working-directory: src/PilotTrade.Web
      - id: npm_audit
        run: npm audit --omit=dev
        working-directory: src/PilotTrade.Web
      - name: Check for vulnerable NuGet packages
        id: nuget_audit
        shell: pwsh
        run: |
          $report = dotnet list PilotTrade.slnx package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }
      - name: Credential and owner authorization tests
        id: credential_tests
        run: dotnet test PilotTrade.slnx --filter "Category=Credentials|Category=OwnerAuthorization" --logger trx --results-directory test-results
      - name: Full test suite
        id: full_tests
        run: dotnet test PilotTrade.slnx --logger trx --results-directory test-results
      - id: publish
        run: dotnet publish src/PilotTrade.Api/PilotTrade.Api.csproj -c Release -r win-x64 --self-contained true -o release/win-x64 -p:SourceRevisionId=${{ github.sha }}
      - name: Build and check the portable ZIP
        id: package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -PublishPath release/win-x64 -OutDir release/package
          Expand-Archive release/package/PilotTrade-win-x64.zip release/unpacked
          ./scripts/verify-package.ps1 -Folder release/unpacked/PilotTrade-win-x64
      - name: Smoke helper checks, PowerShell 7
        id: helpers_pwsh
        shell: pwsh
        run: ./scripts/smoke-helpers.tests.ps1
      - name: Smoke helper checks, Windows PowerShell 5.1
        id: helpers_powershell
        shell: powershell
        run: ./scripts/smoke-helpers.tests.ps1
      - name: Secret scan and manifest checks
        id: release_checks
        shell: pwsh
        run: ./scripts/release-checks.tests.ps1
      # A disposable database and the simulator only. No broker key, live account or real order reaches hosted CI.
      - name: Smoke test
        id: smoke
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Executable release/unpacked/PilotTrade-win-x64/PilotTrade.Api.exe -TestDefaultLocation
      # Runs whatever failed before it, and covers what exists: tracked files, publish output and test results. Its own failure fails the job.
      - name: Secret scan
        id: secret_scan
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $extra = @('release/win-x64', 'release/unpacked', 'test-results') | Where-Object { Test-Path $_ }
          ./scripts/secret-scan.ps1 -ExtraPaths $extra
      - name: Release manifest
        id: manifest
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: ./scripts/release-manifest.ps1 -PublishPath release/unpacked/PilotTrade-win-x64 -PackagePath release/package/PilotTrade-win-x64.zip -Runtime win-x64 -OutFile release/win-x64.manifest.json -RequireClean
      # The build is uploaded only when every step above passed.
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/package/PilotTrade-win-x64.zip
            release/package/PilotTrade-win-x64.zip.sha256
            release/win-x64.manifest.json
      # On failure, test results and the manifest only, and only if the scan of those results came back clean.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.secret_scan.outcome == 'success' }}
        with:
          name: diagnostics-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            test-results
            release/win-x64.manifest.json
